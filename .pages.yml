media:
  input: images
  output: /images

content:
  - name: site
    label: Тексты и картинки сайта
    type: file
    path: _data/content.yml
    fields:
      - name: brand
        label: Имя (шапка, SEO)
        type: string
      - name: booking_url
        label: Ссылка на Telegram (запасная для кнопок записи и «напишите напрямую»)
        type: string
      - name: cal_link
        label: Запись в cal.com — часть ссылки после app.cal.com/ (пусто — кнопки ведут в Telegram)
        type: string

      - name: seo
        label: SEO (поисковики и превью ссылок)
        type: object
        fields:
          - name: description
            label: Описание сайта (текст сниппета в Google/Яндексе, до 160 символов)
            type: text
          - name: og_image
            label: Картинка для превью ссылки (Telegram/WhatsApp, 1200×630)
            type: image

      - name: nav
        label: Меню в шапке
        type: object
        list: true
        fields:
          - name: label
            label: Название
            type: string
          - name: url
            label: Ссылка (#work, #about, #first-session, #faq …)
            type: string

      - name: hero
        label: Главный экран
        type: object
        fields:
          - name: photo
            label: Портрет
            type: image
          - name: headline
            label: Заголовок
            type: string
          - name: lede
            label: Текст
            type: text
          - name: button
            label: Текст кнопки
            type: string

      - name: situations
        label: «Возможно, вы узнаете себя?»
        type: object
        fields:
          - name: headline
            label: Заголовок
            type: string
          - name: items
            label: Карточки
            type: object
            list: true
            fields:
              - name: title
                label: Заголовок
                type: string
              - name: text
                label: Текст
                type: text
          - name: other_link
            label: Подчёркнутая часть нижней строки (ведёт в Telegram)
            type: string
          - name: other_text
            label: Остальной текст нижней строки
            type: text

      - name: specialties
        label: С чем ещё можно прийти
        type: object
        fields:
          - name: headline
            label: Заголовок
            type: string
          - name: items
            label: Строки
            type: object
            list: true
            fields:
              - name: title
                label: Название
                type: string
              - name: text
                label: Описание
                type: text

      - name: stakes
        label: «Это не пройдёт само»
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: paragraphs
            label: Абзацы
            type: object
            list: true
            fields:
              - name: text
                label: Текст
                type: text

      - name: about
        label: Обо мне
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: photo
            label: Фото
            type: image
          - name: paragraphs
            label: Абзацы
            type: object
            list: true
            fields:
              - name: text
                label: Текст
                type: text

      - name: steps
        label: Три шага
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: items
            label: Шаги
            type: object
            list: true
            fields:
              - name: title
                label: Название
                type: string
              - name: text
                label: Описание
                type: text

      - name: first_session
        label: Первая консультация
        type: object
        fields:
          - name: title
            label: Заголовок
            type: text
          - name: subtitle
            label: Подзаголовок над списком
            type: string
          - name: points
            label: Пункты
            type: object
            list: true
            fields:
              - name: text
                label: Текст
                type: string
          - name: button
            label: Текст кнопки
            type: string

      - name: results
        label: «Как это — когда внутри становится иначе»
        type: object
        fields:
          - name: title
            label: Заголовок (перенос строки сохраняется)
            type: text
          - name: points
            label: Пункты
            type: object
            list: true
            fields:
              - name: text
                label: Текст
                type: string

      - name: education
        label: Образование и подготовка
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: intro
            label: Текст под заголовком
            type: text
          - name: placeholder
            label: Надпись на карточке, пока нет скана
            type: string
          - name: documents
            label: Документы
            type: object
            list: true
            fields:
              - name: image
                label: Скан (горизонтальный или вертикальный — карточка подстроится)
                type: image
              - name: thumb
                label: Уменьшенная копия для ленты (необязательно; пусто — берётся скан)
                type: image
              - name: caption
                label: Подпись
                type: string

      - name: guarantees
        label: Гарантии
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: items
            label: Пункты
            type: object
            list: true
            fields:
              - name: title
                label: Название
                type: string
              - name: text
                label: Описание
                type: text

      - name: format
        label: Формат работы
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: rows
            label: Строки карточки
            type: object
            list: true
            fields:
              - name: label
                label: Название
                type: string
              - name: value
                label: Значение
                type: string
          - name: button
            label: Текст кнопки
            type: string
          - name: terms
            label: Условия под карточкой
            type: text

      - name: faq
        label: Частые вопросы
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: items
            label: Вопросы
            type: object
            list: true
            fields:
              - name: q
                label: Вопрос
                type: string
              - name: a
                label: Ответ
                type: text

      - name: cta
        label: Финальный призыв
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: paragraphs
            label: Абзацы
            type: object
            list: true
            fields:
              - name: text
                label: Текст
                type: text
          - name: button
            label: Текст кнопки
            type: string
          - name: direct_before
            label: Текст перед ссылкой на Telegram
            type: string
          - name: direct_link
            label: Текст ссылки на Telegram
            type: string
          - name: photo
            label: Предметное фото под блоком (горизонтальное; пусто — блока нет)
            type: image
          - name: photo_alt
            label: Описание фото (для незрячих и поисковиков)
            type: string

      - name: footer
        label: Футер
        type: object
        fields:
          - name: name
            label: Первая строка
            type: string
          - name: name_url
            label: Ссылка первой строки
            type: string
          - name: contacts
            label: Контакты (пустая ссылка — серый текст без ссылки)
            type: object
            list: true
            fields:
              - name: label
                label: Название
                type: string
              - name: url
                label: Ссылка
                type: string
          - name: docs
            label: Документы
            type: object
            list: true
            fields:
              - name: label
                label: Название
                type: string
              - name: url
                label: Ссылка
                type: string
          - name: copyright
            label: Копирайт
            type: string
