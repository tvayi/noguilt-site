media:
  input: images
  output: /images

content:
  - name: site
    label: Тексты и картинки сайта
    type: file
    path: _data/content.yml
    fields:
      - name: brand
        label: Имя (футер, SEO)
        type: string
      - name: logo
        label: Логотип в шапке
        type: string
      - name: booking_url
        label: Ссылка для записи (Telegram)
        type: string

      - name: seo
        label: SEO (поисковики и превью ссылок)
        type: object
        fields:
          - name: description
            label: Описание сайта (текст сниппета в Google/Яндексе, до 160 символов)
            type: text
          - name: og_image
            label: Картинка для превью ссылки (Telegram/WhatsApp, 1200×630)
            type: image

      - name: header
        label: Шапка
        type: object
        fields:
          - name: meta
            label: Подпись справа
            type: string

      - name: hero
        label: Главный экран
        type: object
        fields:
          - name: photo
            label: Портрет (вертикальный)
            type: image
          - name: photo_label
            label: Подпись заглушки, пока нет фото
            type: string
          - name: headline
            label: Заголовок
            type: text
          - name: lede
            label: Первый абзац
            type: text
          - name: approach
            label: Второй абзац (подходы, формат)
            type: text
          - name: button
            label: Текст кнопки
            type: string
          - name: more
            label: Ссылка «узнать больше»
            type: string
          - name: note
            label: Мелкая подпись внизу
            type: string

      - name: situations
        label: «Возможно, вы сейчас здесь»
        type: object
        fields:
          - name: headline
            label: Заголовок
            type: string
          - name: items
            label: Карточки
            type: object
            list: true
            fields:
              - name: title
                label: Заголовок
                type: string
              - name: text
                label: Текст
                type: text
              - name: link
                label: Текст ссылки
                type: string
              - name: url
                label: Ссылка (#work-1 … #work-5 — строки блока «С чем можно прийти»)
                type: string
          - name: other_link
            label: Подчёркнутая часть нижней строки
            type: string
          - name: other_text
            label: Остальной текст нижней строки
            type: text

      - name: specialties
        label: С чем можно прийти
        type: object
        fields:
          - name: headline
            label: Заголовок
            type: string
          - name: lede
            label: Подзаголовок
            type: text
          - name: items
            label: Строки
            type: object
            list: true
            fields:
              - name: title
                label: Название
                type: string
              - name: text
                label: Описание
                type: text
          - name: note
            label: Подпись под списком
            type: text

      - name: about
        label: Обо мне
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: subtitle
            label: Подзаголовок (имя)
            type: string
          - name: photo
            label: Фото
            type: image
          - name: photo_label
            label: Подпись заглушки, пока нет фото
            type: string
          - name: paragraphs
            label: Абзацы
            type: object
            list: true
            fields:
              - name: text
                label: Текст
                type: text

      - name: trust
        label: На что можно опереться
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: documents
            label: Документы
            type: object
            list: true
            fields:
              - name: title
                label: Заголовок над сканом
                type: string
              - name: image
                label: Скан
                type: image
              - name: caption
                label: Подпись под сканом
                type: string
          - name: principles
            label: Принципы
            type: object
            list: true
            fields:
              - name: title
                label: Заголовок
                type: string
              - name: text
                label: Текст
                type: text

      - name: process
        label: Что будет после записи
        type: object
        fields:
          - name: headline
            label: Заголовок
            type: string
          - name: steps
            label: Шаги
            type: object
            list: true
            fields:
              - name: title
                label: Название
                type: string
              - name: text
                label: Описание
                type: text
          - name: note
            label: Подпись под шагами
            type: text

      - name: pricing
        label: Первая консультация
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: price
            label: Цена
            type: string
          - name: meta
            label: Строка под ценой
            type: string
          - name: intro
            label: Левая колонка — вступление
            type: text
          - name: points
            label: Левая колонка — пункты
            type: object
            list: true
            fields:
              - name: text
                label: Текст
                type: string
          - name: outro
            label: Левая колонка — вывод
            type: text
          - name: terms
            label: Правая колонка — условия
            type: object
            list: true
            fields:
              - name: text
                label: Абзац
                type: text
          - name: button
            label: Текст кнопки
            type: string

      - name: faq
        label: Частые вопросы
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: items
            label: Вопросы
            type: object
            list: true
            fields:
              - name: q
                label: Вопрос
                type: string
              - name: a
                label: Ответ
                type: text

      - name: materials
        label: Полезные материалы
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: lede
            label: Подзаголовок
            type: text
          - name: cards
            label: Карточки
            type: object
            list: true
            fields:
              - name: tag
                label: Метка
                type: string
              - name: title
                label: Заголовок
                type: string
              - name: text
                label: Текст
                type: text
              - name: cta
                label: Текст ссылки
                type: string
              - name: url
                label: Ссылка
                type: string

      - name: cta
        label: Финальный призыв
        type: object
        fields:
          - name: photo
            label: Фото (горизонтальное, 16:9)
            type: image
          - name: title
            label: Заголовок
            type: string
          - name: lede
            label: Подзаголовок
            type: text
          - name: button
            label: Текст кнопки
            type: string

      - name: footer
        label: Футер
        type: object
        fields:
          - name: meta
            label: Подпись под именем
            type: string
          - name: contacts
            label: Контакты
            type: object
            list: true
            fields:
              - name: label
                label: Название
                type: string
              - name: url
                label: Ссылка
                type: string
          - name: docs
            label: Документы
            type: object
            list: true
            fields:
              - name: label
                label: Название
                type: string
              - name: url
                label: Ссылка
                type: string
          - name: copyright
            label: Копирайт
            type: string
