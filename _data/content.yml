    отменённые позже этого срока, оплачиваются полностью. Это помогает мне бережно
    выстраивать расписание, с уважением к нашему общему времени.

faq:
  eyebrow: Частые вопросы
  title: О чём спрашивают
  items:
    - q: Я никогда не была у психолога — что нужно делать?
      a: >-
        Ничего. Записаться, прийти на первую консультацию и рассказать, что
        беспокоит. Не надо готовиться, формулировать в голове или знать
        «правильные слова».
    - q: Сколько всего нужно сессий?
      a: >-
        Зависит от запроса. КПТ — чаще всего короткосрочный подход: от 8 до 20
        сессий при тревоге, ОКР, депрессии. Сложные темы — дольше. Понимание
        объёма появляется после 3-4 встреч.
    - q: Как понять, что мне нужен психолог, а не психиатр?
      a: >-
        Психиатр нужен, если есть тяжёлые симптомы: длительная бессонница,
        панические атаки каждый день, суицидальные мысли. На первой консультации
        я оценю, нужна ли консультация психиатра параллельно — и посоветую,
        к кому идти.
    - q: Откуда можно к вам прийти?
      a: >-
        Откуда угодно — все консультации онлайн. Сейчас работаю из Москвы,
        планирую переезд в Париж — на формате работы это не скажется.
    - q: Как быть, если не подойдёт?
      a: >-
        Скажете прямо — это нормальная часть процесса. Могу порекомендовать
        коллег, чья манера вам может подойти больше. Не подойдёт конкретно
        со мной — не значит, что не подойдёт с другим терапевтом.

