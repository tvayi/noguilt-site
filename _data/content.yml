faq:
  title: О чём спрашивают
  items:
    - q: А если моя проблема недостаточно серьёзная?
      a: >-
        Отдельного порога «достаточной серьёзности» нет. Если что-то мешает жить
        так, как хочется, об этом уже можно поговорить. Начать с небольшой проблемы
        часто даже проще.
    - q: Я никогда не была у психолога. Как начать разговор?
      a: >-
        Готовиться не нужно. Можно начать с того, что беспокоит сейчас, или прямо
        сказать «не знаю, с чего начать». Я буду задавать вопросы и помогу
        сориентироваться.
    - q: Что мы будем делать в КПТ?
      a: >-
        Разбирать конкретные ситуации: какие мысли, чувства и действия в них
        возникают и как они связаны. Вместе подбираем упражнения, которые можно
        пробовать между встречами. Я объясняю, зачем мы делаем каждый шаг.
    - q: Сколько встреч потребуется?
      a: >-
        Зависит от запроса. С тревогой или самокритикой часто работают от 8 до 20
        встреч, сложные темы требуют больше времени. Обязательного количества нет —
        мы регулярно сверяемся, есть ли смысл продолжать.
    - q: Вы назначаете лекарства?
      a: >-
        Нет, я психолог и не назначаю лекарства. Если по вашему состоянию будет
        полезна консультация психиатра, я скажу об этом и помогу понять, к кому
        обратиться.
    - q: Я живу в другой стране. Можно к вам обратиться?
      a: >-
        Да. Все встречи проходят онлайн на русском языке. При записи укажите свой
        часовой пояс — подберём удобное время.
    - q: Что, если я буду плакать или не смогу говорить?
      a: >-
        Это нормально. Можно делать паузы, молчать, возвращаться к теме позже.
        Мы будем двигаться в вашем темпе.
    - q: А если мне не подойдёт работа со мной?
      a: >-
        Об этом можно сказать прямо — это нормальная часть процесса. Первая встреча
        не обязывает продолжать. Если нужно, подскажу, к каким специалистам
        можно обратиться.

