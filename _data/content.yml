      text: Вы оставляете заявку или пишете мне напрямую. Выбираем удобное время.
    - title: Первая консультация
      text: Знакомимся, проясняем запрос, говорим об ожиданиях, намечаем план работы.
    - title: Регулярные встречи
      text: Если чувствуете, что контакт есть — начинаем терапию.

