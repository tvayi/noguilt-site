    расписание, с уважением к нашему общему времени.

faq:
  title: Часто спрашивают
  items:
    - q: Я никогда не была у психолога. С чего начать?
      a: >-
        Для начала заполните форму, ответив на вопросы о том что именно вас беспокоит.
        Я сориентирую смогу ли помочь, обсудим условия и выберем время.
    - q: Как подготовиться к первой консультации?
      a: >-
        Чтобы вам было легче сформулировать свой запрос, перед первой встречей я высылаю
        короткую анкету. Она помогает сориентироваться: «что сейчас причиняет больше всего
        дискомфорта?», «что хотелось бы почувствовать после терапии?». Если слов пока
        нет — это нормально. Разберёмся вместе. От вас важно стабильное интернет
        соединение и уединённое, комфортное место на 50 минут, чтобы встреча прошла
        наиболее эффективно
    - q: Как долго длится терапия?
      a: >-
        Зависит от запроса. С тревогой или самокритикой часто работают от 8 до 20 встреч,
        сложные состояния требуют больше времени. Обязательного количества нет — мы
        регулярно сверяемся, есть ли смысл продолжать.
    - q: Я боюсь говорить о себе незнакомому человеку.
      a: >-
        Я понимаю, это непривычно. И моя задача — не оценивать, а помочь разобраться
        в себе. Здесь нет «правильных» и «неправильных» чувств.
    - q: А вдруг мне станет хуже, когда начну разбираться?
      a: >-
        Иногда в начале бывает непросто. Вы начинаете замечать то, что раньше заглушали.
        Это нормально и временно. Я всегда рядом.
    - q: Можно прийти только на одну консультацию?
      a: >-
        Да, конечно. Вы сами решаете, хотите ли продолжать. Но важно помнить, что первая
        встреча ознакомительная. Иногда её достаточно, иногда нет.
    - q: КПТ — это что-то сложное?
      a: Нет, это способ работы с собой, которому можно научиться. И я буду вам в этом помогать.
    - q: Что именно мы будем делать на консультациях?
      a: >-
        Разбирать конкретные ситуации: какие мысли, чувства и действия в них возникают
        и как они связаны. Вместе подбираем упражнения, которые можно пробовать между
        встречами. Я объясняю, зачем мы делаем каждый шаг.
    - q: А если моя проблема недостаточно серьёзная?
      a: >-
        Отдельного порога «достаточной серьёзности» нет. Если что-то мешает жить так,
        как хочется, об этом уже важно говорить. Начать с небольшой проблемы часто
        даже проще.
    - q: Вы можете параллельно с терапией назначить лекарства?
      a: >-
        Нет, я психолог и не назначаю лекарства. Если по вашему состоянию будет полезна
        консультация другого специалиста, я скажу об этом и помогу понять, к кому
        обратиться.
    - q: Я живу в другой стране. Можно к вам обратиться?
      a: >-
        Да, в этом удобство онлайн консультаций. Вы можете находиться в любой точке мира.
        Встречи проходят на русском языке. При записи укажите свой часовой пояс —
        подберём удобное время.
    - q: Что, если я буду плакать или не смогу говорить?
      a: >-
        Это нормально. Можно делать паузы, молчать, возвращаться к теме позже.
        Мы будем двигаться в вашем темпе.
    - q: А если мне не подойдёт работа с вами?
      a: >-
        Об этом можно сказать прямо — это нормальная часть процесса. Первая встреча
        не обязывает продолжать. Если нужно, подскажу, к каким специалистам можно
        обратиться.

