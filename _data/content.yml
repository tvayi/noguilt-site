guarantees:
  title: "На каждой встрече я гарантирую вам:"
  items:
    - title: Конфиденциальность
      text: >-
        Содержание встреч конфиденциально в рамках закона. Границы обсуждаем
        до начала работы.
    - title: Понятный процесс
      text: >-
        Вы можете спросить, зачем мы обсуждаем тему или пробуем упражнение.
        Я объясняю свои предложения.
    - title: Уважение к вашему опыту
      text: >-
        Здесь можно говорить о стыде, злости и сомнениях. Я не буду обвинять вас
        в том, что вам трудно.
    - title: Свобода решать
      text: >-
        Можно не согласиться, обсудить то, что не подходит, или остановить работу.
        Первая встреча не обязывает продолжать.
    - title: Научный подход
      text: >-
        В своей работе я использую КПТ - научно доказательный подход. Исследования
        показывают высокую эффективность КПТ при лечении тревожных и депрессивных
        расстройств, фобий, соматических симптомов и при трудностях адаптации
        к переездам, смене работы, кризисам.

