bridge:
  eyebrow: Возможно, вам знакомо
  headline: |-
    Бывает, внешне всё в порядке.
    А внутри — слишком много того,
    что приходится держать в себе.
  items:
    - title: Слова находятся слишком поздно.
      text: >-
        В разговоре вы соглашаетесь, молчите или шутите. А потом снова и снова
        прокручиваете, что хотелось сказать.
    - title: Свои чувства проще объяснить, чем почувствовать.
      text: >-
        Можно подробно разобрать, почему вы тревожитесь или злитесь. Но ответить
        на вопрос «чего я хочу?» почему-то сложнее.
    - title: Вы понимаете, что вам не подходит — но всё равно остаётесь.
      text: >-
        В отношениях, работе или привычной роли. И каждый раз находится причина
        ещё немного потерпеть.
  closing: С этим не обязательно оставаться наедине.

specialties:
  headline: С чем я работаю
  lede: >-
    Вам не нужно заранее подобрать точное название своему состоянию. На первой
    встрече можно вместе понять, что происходит и с чего начать.
  items:
    - title: Тревога и перфекционизм
      text: Напряжение, страх ошибки, ощущение, что нужно всё контролировать.
    - title: Самокритика и синдром самозванца
      text: «Внутренний критик», обесценивание своих усилий, тревога «я недостаточно хороша».
    - title: Отношения и личные границы
      text: Трудно отказывать, говорить о важном, выходить из неподходящих отношений.
    - title: Переезд и адаптация
      text: Неопределённость, усталость, потеря привычной опоры в новой среде.
    - title: Кризис смысла и важные решения
      text: >-
        Развод, расставание, потеря работы; период «так больше не хочу», пока
        неясно, куда двигаться дальше.

about:
  eyebrow: Обо мне
  title: Екатерина Игумнова
  photo: ""
  lead: >-
    Клинический психолог. Магистр РГГУ с отличием, член АКПП. Работаю в КПТ
    и экзистенциальном подходе.
  paragraphs:
    - text: >-
        Веду частную практику, регулярно повышаю квалификацию, прохожу супервизии.
        Своими руками справилась с ГТР и ОКР — в терапию пришла и как специалист,
        и как клиент.
    - text: >-
        Не обещаю лёгких решений, не продаю «5 шагов к счастью», не работаю через
        «прими и полюби». Разбираю механику вместе с вами — без обвинений и без магии.

promises:
  headline: |-
    Здесь не нужно соглашаться на то,
    что вам не подходит
  lede: |-
    До начала работы обсуждаем формат и условия.
    В процессе можно задавать вопросы, менять решение или остановиться.
  items:
    - q: Меня не оставят в терапии на годы?
      a: >-
        У терапии нет обязательного срока и пакетов сессий. Мы регулярно сверяемся:
        подходит ли вам формат и есть ли смысл продолжать.
    - q: А если я пойму, что не хочу продолжать?
      a: >-
        Можно остановить работу в любой момент. Я не уговариваю оставаться
        и не давлю на решение продолжать.
    - q: Вдруг появятся непонятные доплаты?
      a: >-
        Стоимость, длительность встречи и правила переноса обсуждаем до начала
        работы. Без скрытых платежей и внезапных условий.
    - q: А если мне станет сложно или я не увижу быстрый результат?
      a: >-
        Терапия не всегда бывает простой. Я честно говорю о ходе работы и вместе
        с вами решаю, что делать дальше.
    - q: Кто-нибудь узнает, что я хожу к психологу?
      a: >-
        Всё, что происходит на сессии, остаётся между нами. Конфиденциальность
        соблюдается в пределах, предусмотренных законом.

