situations:
  headline: Возможно, вы узнаете себя?
  items:
    - title: Делаю много, а внутри всё равно недостаточно
      text: >-
        Вас ценят на работе, задачи закрываются. Но вечером вспоминается одна
        ошибка, а всё сделанное будто не считается. Даже отдых нужно заслужить.
        Вы устали держать высокую планку и боитесь того, что случится, если её снизить.
    - title: Переезд состоялся, а жизнь будто ещё не началась
      text: >-
        Вы решаете вопросы с работой, жильём и документами. А привычной жизни
        не хватает сильнее, чем ожидали. Скучать по дому неловко: ведь решение было
        вашим. Хочется освоиться на новом месте и не обесценивать то, что осталось в прошлом.
    - title: Прежняя жизнь закончилась, а что дальше — непонятно
      text: >-
        После расставания, потери или больших перемен вы продолжаете работать
        и отвечать на сообщения. Но планы, на которые опирались, больше не подходят.
        Окружающие советуют двигаться дальше, а вам пока трудно понять, куда и зачем.
  other_link: Ваша ситуация другая?
  other_text: >-
    Напишите несколько слов о том, что беспокоит. Я подскажу, работаю ли с таким запросом.

specialties:
  headline: С чем ещё можно прийти
  items:
    - title: Тревога и постоянное напряжение
      text: >-
        В голове один за другим возникают сценарии «а вдруг». Трудно расслабиться
        и отпустить контроль. Разберём, что запускает и поддерживает тревогу и какие
        способы реагировать можно пробовать.
    - title: Перфекционизм и самокритика
      text: >-
        Ошибка кажется доказательством, что вы недостаточно хороши, а отдых вызывает
        вину. Будем разбираться с требованиями к себе и искать способы действовать
        без постоянного самонаказания.
    - title: Выгорание и потеря смысла
      text: >-
        Дела выполняются по инерции, а вопрос «зачем мне это» остаётся без ответа.
        Посмотрим, что истощает вас, какие ограничения важно учитывать и что хотелось
        бы менять.
    - title: Кризисы и потери
      text: >-
        Расставание, утрата, потеря работы или привычных планов. Здесь можно говорить
        о произошедшем в своём темпе и постепенно искать, на что опираться дальше.
    - title: Адаптация и релокация
      text: >-
        Переезд, одиночество в новой стране, вина перед близкими, ощущение, что вы
        нигде не дома. Поработаем с тем, как обустраивать жизнь в изменившихся условиях.

stakes:
  title: Это не пройдёт само
  paragraphs:
    - text: >-
        Пока внутри живёт установка «надо быть удобной» — она тихо управляет вами.
        Вы соглашаетесь, когда хочется отказать. Молчите, когда хочется высказаться.
        Ставите свои желания на последнее место, делая вид, что всё нормально.
    - text: >-
        Терапия — не про то, чтобы стать «другой». Это про то, чтобы наконец разрешить
        себе быть собой.

about:
  title: Меня зовут Екатерина
  photo: /images/about-portrait.jpg
  paragraphs:
    - text: >-
        Я магистр психологии с отличием, член Ассоциации Когнитивно-Поведенческих
        Психотерапевтов.
    - text: >-
        В своей работе я опираюсь на глубину переживаний, ваши темп и потребности.
        А так же на инструменты, которые действительно работают в жизни.
    - text: >-
        Цель моей работы - помочь вам эффективно справляться с трудными ситуациями,
        чтобы вы смогли двигаться дальше уже без меня.
    - text: >-
        У меня есть личный опыт тревожного и обсессивно-компульсивного расстройств
        и собственной терапии. Я знаю, как непросто обратиться за помощью, когда
        кажется, что нужно справляться самостоятельно.
    - text: >-
        На встречах я задаю вопросы, объясняю свои предложения и учитываю ваш темп.
        Здесь можно сомневаться, злиться и говорить, если вам что-то не подходит.
        Искать виноватого мы не будем.

steps:
