  title: Сделай один маленький шаг
  paragraphs:
    - text: >-
        Вы не обязаны быть готовыми на 100%. Часто достаточно уже ощущения, что больше
        так не хочется.
    - text: >-
        Первая встреча — это спокойное знакомство, в котором вы можете рассказать о себе,
        задать вопросы и понять, подходит ли вам такой формат работы.
    - text: >-
        И, возможно, это будет первый раз за долгое время, когда вы сделали что-то только
        для себя.
  button: Записаться на консультацию
