process:
  headline: Что будет после записи
  steps:
    - title: Вы пишете в Telegram
      text: >-
        Достаточно сообщения: «Здравствуйте, хочу записаться на первую консультацию».
        Можно сразу указать свой часовой пояс. Рассказывать личную историю
        в переписке необязательно.
    - title: Мы выбираем время
      text: >-
        Согласуем время, площадку и условия встречи. Онлайн в Zoom или Яндекс
        Телемосте. После согласования я пришлю ссылку на оплату, затем — ссылку
        для подключения.
    - title: Встречаемся на 50 минут
      text: >-
        Вы рассказываете, что беспокоит, а я задаю вопросы. Можно начать с недавней
        ситуации или с фразы «не знаю, с чего начать». В конце подведём итог
        и обсудим дальнейшие шаги.
    - title: Вы решаете о продолжении
      text: >-
        Если захотите продолжать, договоримся о частоте встреч и целях работы.
        В процессе будем обсуждать, что меняется и что стоит скорректировать.
  note: >-
    Готовить рассказ о себе или формулировать «правильный запрос» не нужно.
    Паузы и слёзы тоже допустимы.

